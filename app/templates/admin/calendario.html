{% extends "base.html" %}

{% block title %}Agenda Médica - Calendario{% endblock %}

{% block content %}
<section class="calendario-page container">
    <div class="calendario-header">
        <a href="{{ url_for('admin.admin_dashboard') }}" class="back-link">← Volver al Panel</a>
        <h1>📅 Agenda Médica</h1>
    </div>

    <!-- Filtros -->
    <div class="filtros-panel">
        <div class="filtro-group">
            <label for="doctor-select">Médico</label>
            <select id="doctor-select">
                <option value="">Seleccionar médico...</option>
                {% for doctor in doctors %}
                <option value="{{ doctor.id }}" data-color="{{ doctor.doctor_profile.color }}">
                    {{ doctor.doctor_profile.name }} — {{ doctor.doctor_profile.specialty }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="filtro-group">
            <label for="fecha-inicio">Desde</label>
            <input type="date" id="fecha-inicio">
        </div>
        <div class="filtro-group">
            <label for="fecha-fin">Hasta</label>
            <input type="date" id="fecha-fin">
        </div>
        <button id="btn-filtrar" class="btn-filtrar" onclick="loadAppointments()">🔍 Filtrar</button>
        <button class="btn-hoy" onclick="goToToday()">Hoy</button>
    </div>

    <!-- Resumen -->
    <div id="resumen-bar" class="resumen-bar hidden">
        <div class="resumen-item">
            <span class="resumen-num" id="total-citas">0</span>
            <span class="resumen-label">Total Citas</span>
        </div>
        <div class="resumen-item">
            <span class="resumen-num confirmada" id="total-confirmadas">0</span>
            <span class="resumen-label">Confirmadas</span>
        </div>
        <div class="resumen-item">
            <span class="resumen-num pendiente" id="total-pendientes">0</span>
            <span class="resumen-label">Pendientes</span>
        </div>
    </div>

    <!-- Calendario -->
    <div id="calendario-container" class="calendario-container">
        <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h3>Selecciona un médico</h3>
            <p>Elige un médico del listado para ver su agenda de citas.</p>
        </div>
    </div>
</section>

<script>
    const today = new Date();
    const startInput = document.getElementById('fecha-inicio');
    const endInput = document.getElementById('fecha-fin');
    const doctorSelect = document.getElementById('doctor-select');

    // Default: current week (monday to sunday)
    const monday = new Date(today);
    monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    startInput.value = monday.toISOString().split('T')[0];
    endInput.value = sunday.toISOString().split('T')[0];

    function goToToday() {
        const now = new Date();
        const mon = new Date(now);
        mon.setDate(now.getDate() - ((now.getDay() + 6) % 7));
        const sun = new Date(mon);
        sun.setDate(mon.getDate() + 6);
        startInput.value = mon.toISOString().split('T')[0];
        endInput.value = sun.toISOString().split('T')[0];
        if (doctorSelect.value) loadAppointments();
    }

    doctorSelect.addEventListener('change', () => {
        if (doctorSelect.value) loadAppointments();
    });

    async function loadAppointments() {
        const doctorId = doctorSelect.value;
        if (!doctorId) return;

        const start = startInput.value;
        const end = endInput.value;
        const container = document.getElementById('calendario-container');

        container.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Cargando citas...</p></div>';

        try {
            const res = await fetch(`/admin/api/appointments?doctor_id=${doctorId}&start=${start}&end=${end}`);
            const data = await res.json();

            if (!data.appointments || data.appointments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <h3>Sin citas</h3>
                        <p>No hay citas programadas para este período.</p>
                    </div>`;
                updateSummary([]);
                return;
            }

            renderCalendar(data.appointments, start, end);
            updateSummary(data.appointments);
        } catch (err) {
            container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Error</h3><p>${err.message}</p></div>`;
        }
    }

    function updateSummary(appointments) {
        const bar = document.getElementById('resumen-bar');
        bar.classList.remove('hidden');
        document.getElementById('total-citas').textContent = appointments.length;
        document.getElementById('total-confirmadas').textContent = appointments.filter(a => a.status === 'confirmada').length;
        document.getElementById('total-pendientes').textContent = appointments.filter(a => a.status === 'pendiente_confirmacion').length;
    }

    function renderCalendar(appointments, startStr, endStr) {
        const container = document.getElementById('calendario-container');
        const startDate = new Date(startStr + 'T00:00:00');
        const endDate = new Date(endStr + 'T23:59:59');

        // Group by date
        const byDate = {};
        let d = new Date(startDate);
        while (d <= endDate) {
            const key = d.toISOString().split('T')[0];
            byDate[key] = [];
            d.setDate(d.getDate() + 1);
        }

        appointments.forEach(appt => {
            const dateKey = appt.start_time.split('T')[0];
            if (byDate[dateKey]) byDate[dateKey].push(appt);
        });

        const dayNames = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
        const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        const todayStr = new Date().toISOString().split('T')[0];

        let html = '<div class="cal-grid">';
        for (const [dateStr, appts] of Object.entries(byDate)) {
            const dateObj = new Date(dateStr + 'T12:00:00');
            const isToday = dateStr === todayStr;
            const dayName = dayNames[dateObj.getDay()];
            const dayNum = dateObj.getDate();
            const monthName = monthNames[dateObj.getMonth()];

            html += `
                <div class="cal-day ${isToday ? 'today' : ''} ${appts.length === 0 ? 'empty' : ''}">
                    <div class="cal-day-header">
                        <span class="cal-day-name">${dayName}</span>
                        <span class="cal-day-num">${dayNum} ${monthName}</span>
                        ${appts.length > 0 ? `<span class="cal-day-count">${appts.length} cita${appts.length > 1 ? 's' : ''}</span>` : ''}
                    </div>
                    <div class="cal-day-body">`;

            if (appts.length === 0) {
                html += '<p class="no-appts">Sin citas</p>';
            } else {
                appts.sort((a, b) => a.start_time.localeCompare(b.start_time));
                appts.forEach(appt => {
                    const time = new Date(appt.start_time).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
                    const statusClass = appt.status === 'confirmada' ? 'status-confirmed' : 'status-pending';
                    const statusLabel = appt.status === 'confirmada' ? 'Confirmada' : 'Pendiente';
                    html += `
                        <div class="appt-card ${statusClass}">
                            <div class="appt-time">${time}</div>
                            <div class="appt-info">
                                <span class="appt-patient">${appt.patient_name}</span>
                                <span class="appt-service">${appt.service_name}</span>
                            </div>
                            <span class="appt-badge ${statusClass}">${statusLabel}</span>
                        </div>`;
                });
            }

            html += '</div></div>';
        }
        html += '</div>';
        container.innerHTML = html;
    }
</script>

<style>
    .calendario-page {
        padding: 2rem;
        max-width: 1200px;
        margin: 0 auto;
    }

    .calendario-header {
        margin-bottom: 2rem;
    }

    .calendario-header .back-link {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        display: inline-block;
        margin-bottom: 0.5rem;
    }

    .calendario-header h1 {
        margin: 0;
        font-size: 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    /* Filtros */
    .filtros-panel {
        display: flex;
        gap: 1rem;
        align-items: flex-end;
        background: white;
        padding: 1.5rem;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
    }

    .filtro-group {
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        flex: 1;
        min-width: 160px;
    }

    .filtro-group label {
        font-size: 0.8rem;
        font-weight: 700;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .filtro-group select,
    .filtro-group input {
        padding: 0.7rem 1rem;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 0.95rem;
        background: #fafafa;
        transition: border-color 0.3s;
        font-family: 'Outfit', sans-serif;
    }

    .filtro-group select:focus,
    .filtro-group input:focus {
        outline: none;
        border-color: #667eea;
        background: white;
    }

    .btn-filtrar,
    .btn-hoy {
        padding: 0.7rem 1.5rem;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95rem;
        transition: all 0.2s;
        font-family: 'Outfit', sans-serif;
    }

    .btn-filtrar {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }

    .btn-filtrar:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-hoy {
        background: #f0f0f0;
        color: #333;
    }

    .btn-hoy:hover {
        background: #e0e0e0;
    }

    /* Resumen */
    .resumen-bar {
        display: flex;
        gap: 1.5rem;
        margin-bottom: 1.5rem;
    }

    .resumen-item {
        background: white;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
    }

    .resumen-num {
        font-size: 2rem;
        font-weight: 700;
        color: #333;
    }

    .resumen-num.confirmada {
        color: #28a745;
    }

    .resumen-num.pendiente {
        color: #f0ad4e;
    }

    .resumen-label {
        font-size: 0.8rem;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }

    /* Calendar Grid */
    .cal-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1rem;
    }

    .cal-day {
        background: white;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s;
    }

    .cal-day:hover {
        transform: translateY(-2px);
    }

    .cal-day.today {
        border: 2px solid #667eea;
    }

    .cal-day.today .cal-day-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .cal-day-header {
        background: #2c3e50;
        color: white;
        padding: 0.8rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.3rem;
    }

    .cal-day-name {
        font-weight: 700;
        font-size: 0.95rem;
    }

    .cal-day-num {
        font-size: 0.85rem;
        opacity: 0.8;
    }

    .cal-day-count {
        font-size: 0.75rem;
        background: rgba(255, 255, 255, 0.2);
        padding: 0.2rem 0.6rem;
        border-radius: 10px;
    }

    .cal-day-body {
        padding: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-height: 80px;
    }

    .no-appts {
        color: #ccc;
        font-size: 0.85rem;
        text-align: center;
        padding: 1rem 0;
        margin: 0;
    }

    /* Appointment Cards */
    .appt-card {
        padding: 0.7rem;
        border-radius: 10px;
        background: #f8f9fa;
        border-left: 4px solid #ccc;
        display: flex;
        align-items: center;
        gap: 0.6rem;
    }

    .appt-card.status-confirmed {
        border-left-color: #28a745;
        background: #f0fff4;
    }

    .appt-card.status-pending {
        border-left-color: #f0ad4e;
        background: #fffdf0;
    }

    .appt-time {
        font-weight: 700;
        font-size: 0.9rem;
        color: #333;
        white-space: nowrap;
    }

    .appt-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
    }

    .appt-patient {
        font-weight: 600;
        font-size: 0.85rem;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .appt-service {
        font-size: 0.75rem;
        color: #888;
    }

    .appt-badge {
        font-size: 0.65rem;
        padding: 0.2rem 0.5rem;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        white-space: nowrap;
    }

    .appt-badge.status-confirmed {
        background: #d4edda;
        color: #155724;
    }

    .appt-badge.status-pending {
        background: #fff3cd;
        color: #856404;
    }

    /* Empty & Loading States */
    .empty-state,
    .loading-state {
        text-align: center;
        padding: 4rem 2rem;
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .empty-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .empty-state h3 {
        margin: 0 0 0.5rem;
        color: #333;
    }

    .empty-state p {
        color: #888;
        margin: 0;
    }

    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e9ecef;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 1rem;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .hidden {
        display: none !important;
    }

    @media (max-width: 768px) {
        .filtros-panel {
            flex-direction: column;
        }

        .filtro-group {
            min-width: 100%;
        }

        .resumen-bar {
            flex-direction: column;
        }

        .cal-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}
