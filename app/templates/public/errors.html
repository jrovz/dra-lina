{% extends "base.html" %}

{% block title %}{{ error_code }} - {{ error_title }}{% endblock %}

{% block content %}
<div
    style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:2rem;">
    <div style="font-size:6rem;font-weight:800;color:#6366f1;line-height:1;">{{ error_code }}</div>
    <h1 style="font-size:1.75rem;margin:1rem 0 0.5rem;color:#1e293b;">{{ error_title }}</h1>
    <p style="color:#64748b;max-width:420px;margin-bottom:2rem;">{{ error_message }}</p>
    <a href="{{ url_for('public.index') }}"
        style="display:inline-block;padding:0.75rem 2rem;background:#6366f1;color:white;text-decoration:none;border-radius:0.5rem;font-weight:600;transition:background 0.2s;"
        onmouseover="this.style.background='#4f46e5'" onmouseout="this.style.background='#6366f1'">
        Volver al inicio
    </a>
</div>
{% endblock %}
